name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` requires package-lock.json to be in sync with package.json.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The app renders a configuration setup screen instead of the real UI when
      # these are absent, so every page assertion fails on a clean checkout. The
      # E2E suite intercepts every /functions/v1 call, so only the presence of the
      # variables matters here — not their values. A placeholder keeps the workflow
      # self-contained, so a fork does not need repository variables configured to
      # get a green run, and no real credential is needed in the repository.
      - name: Provide build-time env
        run: |
          cp .env.example .env
          sed -i "s|^VITE_SUPABASE_PUBLISHABLE_KEY=.*|VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder|" .env

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    # `secrets` is not an available context for a step-level `if`, so gating on it
    # directly invalidates the entire workflow file — GitHub reports that as
    # "likely failed because of a workflow file issue" and never runs a step. It
    # has to be lifted into a job-level variable, which *is* reachable through the
    # `env` context that step-level conditions do support.
    env:
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: deno check supabase/functions/analyze-message/index.ts supabase/functions/scenario-feedback/index.ts supabase/functions/voice-debrief/index.ts

      - name: Lint
        run: deno lint supabase/functions

      - name: Format check
        run: deno fmt --check supabase/functions

      # Allow-env is required because config.ts reads Deno.env at request time.
      - name: Test
        run: deno test --allow-env supabase/functions

      # Harness self-test: verifies the dataset parses, the metrics compute, and
      # the prompt-injection gate fires. Uses deterministic fixtures, so it needs
      # no API key and makes no network calls.
      - name: Evaluation harness (mock provider)
        run: deno run --allow-env --allow-net eval/run.ts

      # Real accuracy numbers. Skipped unless a key is configured, so a fork does
      # not fail for lack of a secret.
      - name: Evaluation harness (live)
        if: env.HAS_LLM_KEY == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: deno run --allow-env --allow-net eval/run.ts --provider=live --json > eval-results.json

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_LLM_KEY == 'true'
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 30
