name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly accuracy measurement. Accuracy drifts with the model and the
  # provider, not only with the code, and a drift nobody looks at is a drift
  # nobody notices.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every step only reads the repository. Uploading artifacts
# does not use the workflow token, so no write scope is needed. Without this,
# the token inherits the repository default, which may be read/write for all
# scopes.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # A hung Playwright run previously held a runner until GitHub's six-hour
    # ceiling. The suite takes well under a minute on this runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` requires package-lock.json to be in sync with package.json.
      - run: npm ci

      # Deno resolves its config from the working directory upward and never
      # descends into a subdirectory, so without an explicit --config these steps
      # silently ignore supabase/functions/deno.json and then look for `npm:zod`
      # in a node_modules folder that the Deno job never installs.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The app renders a configuration setup screen instead of the real UI when
      # these are absent, so every page assertion fails on a clean checkout. The
      # E2E suite intercepts every /functions/v1 call, so only the presence of the
      # variables matters here — not their values. A placeholder keeps the workflow
      # self-contained, so a fork does not need repository variables configured to
      # get a green run, and no real credential is needed in the repository.
      - name: Provide build-time env
        run: |
          cp .env.example .env
          sed -i "s|^VITE_SUPABASE_PUBLISHABLE_KEY=.*|VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder|" .env

      - name: Build
        run: npm run build

      # The audience is a student on a school phone. The bundle size is a
      # decision, not an accident, and this is what stops it becoming one by
      # accident. Raising the budget is allowed; raising it silently is not.
      - name: Bundle size budget
        run: npm run size

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    # The live evaluation is 45 real model calls, which takes minutes even when
    # the provider is quick. This is the ceiling for a hung run, not a target.
    timeout-minutes: 30
    # `secrets` is not an available context for a step-level `if`, so gating on it
    # directly invalidates the entire workflow file — GitHub reports that as
    # "likely failed because of a workflow file issue" and never runs a step. It
    # has to be lifted into a job-level variable, which *is* reachable through the
    # `env` context that step-level conditions do support.
    env:
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Deno resolves its config from the working directory upward and never
      # descends into a subdirectory, so without an explicit --config these steps
      # silently ignore supabase/functions/deno.json and then look for `npm:zod`
      # in a node_modules folder that the Deno job never installs.
      - name: Typecheck
        run: deno check --config supabase/functions/deno.json server/main.ts supabase/functions/analyze-message/index.ts supabase/functions/scenario-feedback/index.ts supabase/functions/voice-debrief/index.ts

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions server

      - name: Format check
        run: deno fmt --config supabase/functions/deno.json --check supabase/functions server

      # Allow-env is required because config.ts reads Deno.env at request time;
      # --unstable-kv so the Deno KV rate-limit backend is actually exercised
      # instead of being skipped and falling through to process memory.
      - name: Test
        run: deno test --config supabase/functions/deno.json --allow-env --unstable-kv supabase/functions server

      # Harness self-test: verifies the dataset parses, the metrics compute, and
      # the prompt-injection gate fires. Uses deterministic fixtures, so it needs
      # no API key and makes no network calls.
      - name: Evaluation harness (mock provider)
        run: deno run --config supabase/functions/deno.json --allow-env --allow-net eval/run.ts

  # Real accuracy numbers, measured against the live provider.
  #
  # This is its own job because it is a measurement, not a gate. The harness
  # deliberately does not gate on accuracy, and 45 real model calls against a
  # free endpoint take minutes — sometimes a long time when the endpoint is
  # contended. Living inside the Deno job it would either blow that job's
  # timeout or make every push red for a reason that has nothing to do with
  # the change being pushed.
  #
  # `continue-on-error` at the job level is what makes it safe: the job reports
  # its result, and the workflow is green either way.
  #
  # A provider outage on 2026-10-29 produced 36 of 45 errors and spent 58 of the
  # job's 60 minutes. `--max-errors=10` stops once ten cases have produced no
  # verdict, so a bad provider day fails in minutes. The JSON records
  # planned_cases/stopped_early, and the text report says the metrics are partial.
  live-eval:
    name: Evaluation harness (live)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    needs: edge-functions
    if: github.event_name == 'push' || github.event_name == 'schedule'
    env:
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Evaluation harness (live)
        if: env.HAS_LLM_KEY == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # The same list the deployment uses, so this measures the configuration
          # that actually serves students rather than one lucky model.
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
        run: deno run --config supabase/functions/deno.json --allow-env --allow-net eval/run.ts --provider=live --max-errors=10 --json > eval-results.json

      - uses: actions/upload-artifact@v7
        if: always() && env.HAS_LLM_KEY == 'true'
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 30
