<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HARIS">
  <!--
    Favicon / app icon. Two flat colours and no gradients on purpose: anything
    finer turns to mush at 16px in a browser tab.
  -->
