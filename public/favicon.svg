  <!-- Shield silhouette -->
  <path d="M32 9 L51 16.5 V32.5 C51 43.5 43 52.5 32 56 C21 52.5 13 43.5 13 32.5 V16.5 Z"
        fill="#22c55e"/>

  <!-- Check mark, knocked out of the shield -->
