<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HARIS — Every verdict comes with the evidence behind it">
  <!--
    Source for public/og-image.png.

    Rendered with IBM Plex Sans / Plex Sans Arabic and Plex Mono, the same
    families the app ships. This vector fallback names them first and falls back
    to a system sans, so it stays legible for anyone without the fonts installed.

    Palette: the dark theme's background, card border, foreground, muted
    foreground and cyan primary. Green is deliberately absent — in this product
    green means "safe", and a brand asset has no business spending it.
  -->
  <defs>
    <style>
      .sans { font-family: "IBM Plex Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
      .arabic { font-family: "IBM Plex Sans Arabic", "DejaVu Sans", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0c1018"/>
  <rect x="26" y="26" width="1148" height="578" rx="6" fill="none" stroke="#20252e"/>

  <!-- H lettermark: same geometry as public/favicon.svg, scaled into a tile -->
  <rect x="72" y="72" width="56" height="56" rx="15" fill="#25b2f3"/>
  <g transform="translate(85 85) scale(0.46875)" fill="#0c1018">
    <rect x="16" y="14" width="10" height="36"/>
    <rect x="38" y="14" width="10" height="36"/>
    <rect x="16" y="29" width="32" height="6"/>
  </g>

  <!-- wordmark -->
  <text x="144" y="112" class="sans" font-size="38" font-weight="700" letter-spacing="-0.6" fill="#e7edf4">HARIS</text>
  <text x="282" y="112" class="arabic" font-size="21" fill="#8f98a3" direction="rtl">هاريس</text>
  <text x="1128" y="103" class="mono" font-size="13" text-anchor="end" fill="#8f98a3">haris-two-xi.vercel.app</text>

  <!-- tagline -->
  <text x="78" y="204" class="mono" font-size="12" letter-spacing="2.4" fill="#8f98a3">CYBERSECURITY AWARENESS TRAINING</text>
  <text x="78" y="280" class="sans" font-size="58" font-weight="600" letter-spacing="-1.4" fill="#e7edf4">Every verdict comes</text>
  <text x="78" y="345" class="sans" font-size="58" font-weight="600" letter-spacing="-1.4" fill="#e7edf4">with the <tspan fill="#25b2f3">evidence</tspan> behind it.</text>

  <!-- footer -->
  <line x1="78" y1="478" x2="1122" y2="478" stroke="#20252e"/>

  <text x="78" y="526" class="mono" font-size="12" fill="#25b2f3">01</text>
  <text x="98" y="527" class="sans" font-size="17" font-weight="600" fill="#e7edf4">Analyze</text>
  <text x="98" y="551" class="sans" font-size="14" fill="#8f98a3">paste a message, read the proof</text>

  <text x="430" y="526" class="mono" font-size="12" fill="#25b2f3">02</text>
  <text x="450" y="527" class="sans" font-size="17" font-weight="600" fill="#e7edf4">Simulate</text>
  <text x="450" y="551" class="sans" font-size="14" fill="#8f98a3">make the call, live with it</text>

  <text x="790" y="526" class="mono" font-size="12" fill="#25b2f3">03</text>
  <text x="810" y="527" class="sans" font-size="17" font-weight="600" fill="#e7edf4">Train</text>
  <text x="810" y="551" class="sans" font-size="14" fill="#8f98a3">hear the flags as they pass</text>
</svg>
