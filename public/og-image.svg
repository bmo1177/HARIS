<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HARIS — Human-Aware Risk Intelligence Shield">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M300 0 V630 M500 0 V630 M700 0 V630 M900 0 V630 M1100 0 V630"/>
  </g>

  <!-- H lettermark tile: same geometry as favicon.svg, scaled 64 -> 220 -->
  <g transform="translate(86 165)">
    <rect width="220" height="220" rx="48" fill="#0b1220"/>
    <rect x="55" y="48" width="34" height="124" fill="#22c55e"/>
    <rect x="131" y="48" width="34" height="124" fill="#22c55e"/>
    <rect x="55" y="100" width="110" height="20" fill="#22c55e"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="252" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="bold" fill="#f8fafc" letter-spacing="6">HARIS</text>

  <text x="362" y="304" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" fill="#4ade80" letter-spacing="3.5">HUMAN-AWARE RISK INTELLIGENCE SHIELD</text>

  <rect x="362" y="336" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- pillars -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <g transform="translate(362 392)">
      <rect width="248" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="40" font-size="23" font-weight="bold" fill="#f1f5f9">Analyse</text>
      <text x="22" y="68" font-size="17" fill="#94a3b8">paste any message</text>
    </g>
    <g transform="translate(632 392)">
      <rect width="248" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="40" font-size="23" font-weight="bold" fill="#f1f5f9">Simulate</text>
      <text x="22" y="68" font-size="17" fill="#94a3b8">live attack scenarios</text>
    </g>
    <g transform="translate(902 392)">
      <rect width="248" height="92" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="40" font-size="23" font-weight="bold" fill="#f1f5f9">Train</text>
      <text x="22" y="68" font-size="17" fill="#94a3b8">hear and flag vishing</text>
    </g>
  </g>

  <text x="362" y="552" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="21" fill="#cbd5e1">Train your scam instincts before someone trains them on you.</text>
</svg>
